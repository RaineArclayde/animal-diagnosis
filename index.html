<!DOCTYPE html>
<html lang="ja">

<head>
    <link rel="icon" href="images/favicon.webp">
    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >

    <title>FIORALUNE モチーフアニマル診断</title>

    <link
        rel="stylesheet"
        href="style.css"
    >

</head>


<body>

<div id="app">


    <!-- ====================================
     スタート画面
==================================== -->

<section id="start-screen">

    <div id="start-book">
        <img
            src="images/start_book.webp"
            alt="モチーフアニマル図鑑"
        >
    </div>

    <button id="start-btn">

        <img
            src="images/start_button.webp"
            alt=""
        >

        <span>図鑑を開く</span>

    </button>

</section>

<div id="white-transition"></div>

    <!-- ====================================
         診断画面
    ==================================== -->

    <section
        id="quiz-screen"
        class="hidden"
    >

    <!-- ここに既存の質問画面の内容 -->

    <!-- 右下メニュー -->
    <div id="quiz-menu">
        <button id="menu-toggle" type="button" aria-label="メニューを開く">
            <span></span>
            <span></span>
            <span></span>
        </button>

        <div id="menu-panel">
            <a href="https://geisai.jp">
                本サイトに戻る
            </a>
        </div>
    </div>

        <!-- ====================================
             上フレーム
        ==================================== -->

        <img
            src="images/play-frame-sp-left.webp"
            class="play-frame frame-sp-left"
            alt=""
        >

        <img
            src="images/play-frame-sp-right.webp"
            class="play-frame frame-sp-right"
            alt=""
        >

        <img
            src="images/play-frame-pc-left.webp"
            class="play-frame frame-pc-left"
            alt=""
        >

        <img
            src="images/play-frame-pc-right.webp"
            class="play-frame frame-pc-right"
            alt=""
        >


        <!-- ====================================
             下フレーム
             ※質問画面だけ
        ==================================== -->

        <img
            src="images/play-frame-pc-bottom-left.webp"
            class="play-frame frame-pc-bottom"
            alt=""
        >

        <img
            src="images/play-frame-sp-bottom-left.webp"
            class="play-frame frame-sp-bottom"
            alt=""
        >


        <!-- ====================================
             問題数
        ==================================== -->

        <div id="progress-container">

            <div id="progress-text">

                <span id="current-number">
                    1
                </span>

                <span id="total-number">
                    /12
                </span>

            </div>

        </div>


        <!-- ====================================
             質問
        ==================================== -->

        <div id="question-container">

            <h2 id="question"></h2>


            <!-- 選択肢 -->

            <div id="choices"></div>


            <!-- ====================================
                 成長する進捗UI
            ==================================== -->

            <div id="growth-progress">

                <div class="soil-bar"></div>

                <div class="seeds">

                    <img
                        class="seed"
                        src="images/seed.webp"
                        alt=""
                    >

                    <img
                        class="seed"
                        src="images/seed.webp"
                        alt=""
                    >

                    <img
                        class="seed"
                        src="images/seed.webp"
                        alt=""
                    >

                    <img
                        class="seed"
                        src="images/seed.webp"
                        alt=""
                    >

                    <img
                        class="seed"
                        src="images/seed.webp"
                        alt=""
                    >

                    <img
                        class="seed"
                        src="images/seed.webp"
                        alt=""
                    >

                    <img
                        class="seed"
                        src="images/seed.webp"
                        alt=""
                    >

                    <img
                        class="seed"
                        src="images/seed.webp"
                        alt=""
                    >

                    <img
                        class="seed"
                        src="images/seed.webp"
                        alt=""
                    >

                    <img
                        class="seed"
                        src="images/seed.webp"
                        alt=""
                    >

                    <img
                        class="seed"
                        src="images/seed.webp"
                        alt=""
                    >

                    <img
                        class="seed"
                        src="images/seed.webp"
                        alt=""
                    >

                </div>

            </div>


            <!-- ====================================
                 前の質問へ
            ==================================== -->

            <button id="back-btn">
                Back
            </button>

        </div>

    </section>

    
   <!-- ====================================
     結果画面
==================================== -->

<section
    id="result-container"
    class="hidden"
>
 
    <!-- 結果画面 上部フレーム -->

    <img
        src="images/play-frame-pc-left.webp"
        class="play-frame frame-pc-left"
        alt=""
    >

    <img
        src="images/play-frame-pc-right.webp"
        class="play-frame frame-pc-right"
        alt=""
    >
    <!-- ====================================
         結果内容
    ==================================== -->

    <div id="result-label">
        診断結果
    </div>


    <h2 id="result-title"></h2>


    <!-- あなたの動物 -->

   <img
    id="animal-image"
    src="images/キツネアイコン.webp"
    alt=""
>


    <div id="result-keywords"></div>


    <div id="result-text"></div>


    <!-- =================================
         4軸
    ================================== -->

   <div id="axis-result">

    <div class="axis-item">

        <div class="axis-heading">
            旅の仲間
        </div>

        <div class="axis-label">
            <span>共旅</span>
            <span>独旅</span>
        </div>

        <div class="axis-bar">
            <div class="axis-point" id="axis-activity"></div>
        </div>

    </div>


    <div class="axis-item">

        <div class="axis-heading">
            旅の行き先
        </div>

        <div class="axis-label">
            <span>探索</span>
            <span>定住</span>
        </div>

        <div class="axis-bar">
            <div class="axis-point" id="axis-exploration"></div>
        </div>

    </div>


    <div class="axis-item">

        <div class="axis-heading">
            旅の頼り
        </div>

        <div class="axis-label">
            <span>縁</span>
            <span>知恵</span>
        </div>

        <div class="axis-bar">
            <div class="axis-point" id="axis-empathy"></div>
        </div>

    </div>


    <div class="axis-item">

        <div class="axis-heading">
            旅の歩み方
        </div>

        <div class="axis-label">
            <span>漂泊</span>
            <span>道行</span>
        </div>

        <div class="axis-bar">
            <div class="axis-point" id="axis-adaptability"></div>
        </div>

    </div>

</div>

    <!-- =================================
         相性
    ================================== -->

    <div id="compatibility">

        <h3 id="compatibility-title">
            相性の良いモチーフアニマル
        </h3>

        <div id="compatibility-cards"></div>

    </div>

    <div id="share-section">

    <h3>旅の記録を残す</h3>

    <div id="share-card">
        <div class="share-card-label">
            モチーフアニマル診断
        </div>

        <img
            id="share-animal-image"
            src=""
            alt=""
        >

        <div class="share-card-title">
            あなたの旅の相棒は
        </div>

        <div id="share-animal-name"></div>

        <div class="share-card-message">
            あなたの旅の物語を<br>
            一緒に歩むモチーフアニマル
        </div>
    </div>


    <!-- 記録画像ダウンロード -->

    <button
        id="download-result-btn"
        class="share-download-btn"
    >
        記録を画像として保存する
    </button>

    <p class="share-download-note">
        ↑ SNSでシェアする画像はこちらから保存できます
    </p>


    <!-- SNS -->

    <div id="share-buttons">

        <button
            id="share-x-btn"
            class="share-sns-btn"
        >
            <span class="share-sns-icon">𝕏</span>
            <span>Xでシェア</span>
        </button>

        <button
            id="share-instagram-btn"
            class="share-sns-btn"
        >
            <span class="share-sns-icon">◎</span>
            <span>Instagramを開く</span>
        </button>

    </div>

</div>

    <!-- =================================
         もう一度診断
    ================================== -->

    <button id="restart-btn">
        もう一度診断する
    </button>


    <a
        href="https://geisai.jp"
        id="exit-btn"
    >
        診断を終了する
    </a>


</section>


</div>
    
<!-- ========================================
     JavaScript
======================================== -->

<script src="data/questions.js"></script>

<script src="data/animals.js"></script>

<script src="main.js"></script>


</body>

</html>
